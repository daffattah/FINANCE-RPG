<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buku Kas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#1F3B2C;
    --cover-dark:#152A1F;
    --paper:#EEF2E7;
    --paper-line:#CFDAC4;
    --paper-white:#FCFBF6;
    --ink:#1C2430;
    --ink-soft:#5B6570;
    --debit:#A6342A;
    --credit:#2F6B4F;
    --brass:#B4903F;
    --shadow: 0 14px 34px rgba(15,30,20,0.22);
    --keperluan:#C79A1F;
    --keperluan-bg:#FBF3D9;
    --credit-bg:#E6F0E9;
    --debit-bg:#F6E8E6;
    --cat-jajan:#C97B4A;
    --cat-transportasi:#4C6E8C;
    --cat-keperluan:#E8B93F;
    --cat-makanan:#5F7A4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at top, #2c4a38 0%, #0f1d15 70%);
    min-height:100vh;
    padding:28px 14px 60px;
  }
  .book{
    position:relative;
    display:flex;
    flex-direction:column;
    max-width:560px;
    margin:0 auto;
    background:var(--paper);
    border-radius:6px;
    box-shadow:var(--shadow);
    overflow:hidden;
    padding-left:46px;
    min-height:70vh;
  }
  .book::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0; width:46px;
    background:linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
  }
  .book::after{
    content:"";
    position:absolute;
    left:20px; top:0; bottom:0; width:6px;
    background-image: radial-gradient(circle, var(--paper) 2.6px, transparent 2.7px);
    background-size: 6px 34px;
    background-repeat: repeat-y;
    background-position: 0 22px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:20px 22px 14px;
    border-bottom:1px solid var(--paper-line);
  }
  .topbar-brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:0.04em;
    color:var(--cover);
  }
  .topbar-saldo{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .page-content{
    background-image: repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
    padding: 26px 24px 34px;
    flex:1 1 auto;
  }
  .screen-header{ margin-bottom:6px; }
  .back-link{
    background:none;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.88rem;
    color:var(--ink-soft);
    cursor:pointer;
    padding:4px 0;
  }
  .back-link:hover{ color:var(--ink); }
  h2.screen-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:6px 0 4px;
    color:var(--ink);
  }
  .screen-desc, .step-label{
    font-size:0.9rem;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  .step-label{
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:0.72rem;
    font-weight:600;
    color:var(--brass);
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:12px 14px;
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:1rem;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }
  .field-error{
    color:var(--debit);
    font-size:0.8rem;
    margin-top:6px;
    display:none;
  }
  .field-error.show{ display:block; }
  .primary-btn, .secondary-btn{
    width:100%;
    padding:14px 18px;
    border-radius:4px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    margin-top:6px;
    border:none;
  }
  .primary-btn{
    background:var(--cover);
    color:var(--paper-white);
  }
  .primary-btn:hover{ background:var(--cover-dark); }
  .secondary-btn{
    background:transparent;
    color:var(--cover);
    border:1px solid var(--cover);
    margin-top:12px;
  }
  .secondary-btn:hover{ background:rgba(31,59,44,0.06); }

  /* Main menu */
  .stamp-wrap{ display:flex; justify-content:center; margin:18px 0 30px; }
  .stamp{
    width:168px; height:168px;
    border-radius:50%;
    border:3px double var(--credit);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transform:rotate(-6deg);
    color:var(--credit);
    text-align:center;
    padding:10px;
  }
  .stamp-label{
    font-size:0.7rem;
    letter-spacing:0.18em;
    font-weight:600;
  }
  .stamp-amount{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.28rem;
    margin-top:6px;
    word-break:break-word;
  }
  .menu-list{ display:flex; flex-direction:column; gap:12px; }
  .menu-btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-left:4px solid var(--brass);
    border-radius:4px;
    padding:16px 16px;
    cursor:pointer;
  }
  .menu-btn:hover{ background:#fff; border-left-color:var(--cover); }
  .menu-icon{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.3rem;
    color:var(--cover);
    width:28px; text-align:center;
    flex-shrink:0;
  }
  .menu-text strong{
    display:block;
    font-size:1rem;
    color:var(--ink);
    font-family:'Fraunces', serif;
    font-weight:600;
  }
  .menu-text small{
    display:block;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:2px;
  }

  /* Confirmation */
  .confirm-card{
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:18px 18px;
    margin-bottom:8px;
  }
  .confirm-card p{ margin:4px 0; }
  .confirm-date{ font-size:0.85rem; color:var(--ink-soft); }
  .confirm-ket{ font-size:1rem; font-weight:600; }
  .confirm-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.15rem;
    color:var(--debit);
    font-weight:600;
  }
  .confirm-saldo{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.9rem;
    color:var(--ink-soft);
    border-top:1px dashed var(--paper-line);
    padding-top:10px;
    margin-top:10px !important;
  }

  /* Table */
  .ledger-table-wrap{
    overflow-x:auto;
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-radius:4px;
  }
  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    min-width:520px;
  }
  table.ledger th{
    background:var(--cover);
    color:var(--paper-white);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    text-align:left;
    padding:10px 10px;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    white-space:nowrap;
  }
  table.ledger td{
    padding:9px 10px;
    border-bottom:1px solid var(--paper-line);
    white-space:nowrap;
  }
  table.ledger td.ket{ white-space:normal; min-width:130px; }
  table.ledger td.num{ text-align:right; }
  table.ledger tr.row-saldo td.num.nominal{ color:var(--ink-soft); }
  table.ledger tr.row-pengeluaran td.num.nominal{ color:var(--debit); }
  table.ledger td.saldo-col{ font-weight:600; }
  table.ledger tr.row-saldo{ background:var(--credit-bg); border-left:3px solid var(--credit); }
  table.ledger tr.row-pengeluaran{ background:var(--debit-bg); border-left:3px solid var(--debit); }
  table.ledger tr.row-keperluan{ background:var(--keperluan-bg); border-left:3px solid var(--keperluan); }
  table.ledger tr.row-keperluan td.num.nominal{ color:var(--keperluan); }
  table.ledger td.aksi-col{ white-space:nowrap; }
  .row-aksi{ display:flex; gap:6px; }
  .row-aksi button{
    padding:5px 9px;
    border-radius:3px;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--paper-line);
    background:var(--paper-white);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .row-aksi .edit-btn{ color:var(--cover); }
  .row-aksi .edit-btn:hover{ background:#fff; border-color:var(--cover); }
  .row-aksi .del-btn{ color:var(--debit); }
  .row-aksi .del-btn:hover{ background:#fff; border-color:var(--debit); }
  .kategori-badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.02em;
    padding:3px 7px;
    border-radius:3px;
    white-space:nowrap;
  }
  .kategori-badge.jajan{ background:rgba(201,123,74,0.16); color:var(--cat-jajan); }
  .kategori-badge.transportasi{ background:rgba(76,110,140,0.16); color:var(--cat-transportasi); }
  .kategori-badge.keperluan{ background:rgba(232,185,63,0.22); color:#8A6B15; }
  .kategori-badge.makanan_utama{ background:rgba(95,122,79,0.16); color:var(--cat-makanan); }
  .ledger-legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:12px;
    font-size:0.76rem;
    color:var(--ink-soft);
  }
  .ledger-legend span{ display:flex; align-items:center; gap:5px; }
  .ledger-legend i{
    width:10px; height:10px;
    border-radius:2px;
    display:inline-block;
  }
  .ledger-legend i.dot-saldo{ background:var(--credit); }
  .ledger-legend i.dot-pengeluaran{ background:var(--debit); }
  .ledger-legend i.dot-keperluan{ background:var(--keperluan); }
  .search-field{ margin-bottom:14px; position:relative; }
  .search-field input{
    width:100%;
    padding:11px 14px;
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-radius:4px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }
  .search-field input:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  .search-empty{
    padding:24px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.85rem;
  }
  .empty-state{
    padding:32px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
  }
  .reset-link{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .table-footer{ text-align:center; }

  /* Alokasi Dana */
  .bulan-select-wrap{ margin-bottom:20px; }
  .pie-wrap{ display:flex; justify-content:center; margin:10px 0 22px; }
  .pie-chart{
    width:200px; height:200px;
    border-radius:50%;
    box-shadow:0 4px 14px rgba(15,30,20,0.18);
    position:relative;
    flex-shrink:0;
  }
  .pie-chart::after{
    content:"";
    position:absolute;
    inset:26%;
    background:var(--paper);
    border-radius:50%;
    box-shadow:inset 0 2px 6px rgba(15,30,20,0.12);
  }
  .pie-total{
    position:absolute;
    inset:26%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:1;
    text-align:center;
    padding:6px;
  }
  .pie-total small{ font-size:0.62rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; }
  .pie-total strong{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--ink); margin-top:3px; word-break:break-word; }
  .alokasi-legend{ display:flex; flex-direction:column; gap:10px; }
  .alokasi-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:11px 14px;
  }
  .alokasi-item-label{ display:flex; align-items:center; gap:9px; }
  .alokasi-dot{ width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .alokasi-item-name{ font-size:0.88rem; font-weight:600; color:var(--ink); }
  .alokasi-item-values{ text-align:right; }
  .alokasi-item-nominal{ font-family:'IBM Plex Mono', monospace; font-size:0.84rem; color:var(--ink); }
  .alokasi-item-pct{ font-size:0.74rem; color:var(--ink-soft); }
  .alokasi-note{ font-size:0.78rem; color:var(--ink-soft); margin-top:16px; line-height:1.5; }

  /* Notifikasi & keperluan */
  .notif-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background:#FBF0D9;
    border:1px solid var(--brass);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:18px;
    font-size:0.86rem;
    color:var(--ink);
    cursor:pointer;
  }
  .notif-banner:hover{ background:#F7E6BE; }
  .notif-toggle{
    width:100%;
    background:none;
    border:1px dashed var(--paper-line);
    color:var(--ink-soft);
    border-radius:4px;
    padding:10px 12px;
    font-size:0.78rem;
    margin-top:16px;
    cursor:pointer;
  }
  .notif-toggle:hover{ color:var(--cover); border-color:var(--cover); }
  .keperluan-list{ display:flex; flex-direction:column; gap:12px; }
  .keperluan-item{
    background:var(--paper-white);
    border:1px solid var(--paper-line);
    border-left:4px solid var(--paper-line);
    border-radius:4px;
    padding:14px 16px;
  }
  .keperluan-item.due{ border-left-color:var(--brass); }
  .keperluan-ket{ font-weight:600; margin:0 0 2px; }
  .keperluan-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  .keperluan-flag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 8px;
  }
  .keperluan-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .keperluan-actions button{
    flex:1 1 auto;
    padding:9px 10px;
    border-radius:4px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--paper-line);
    background:var(--paper);
  }
  .beli-btn{ background:var(--credit)!important; color:#fff!important; border-color:var(--credit)!important; }
  .beli-btn:hover{ opacity:0.9; }
  .ics-btn{ color:var(--cover); }
  .ics-btn:hover{ background:#fff; }
  .hapus-btn{ color:var(--debit); }
  .hapus-btn:hover{ background:#fff; }

  .watermark{
    position:absolute;
    right:5%;
    bottom:64px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    color:var(--cover);
    opacity:0.11;
    transform:rotate(-7deg);
    pointer-events:none;
    user-select:none;
    z-index:0;
    white-space:nowrap;
  }
  .watermark-label{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:clamp(0.62rem, 2.1vw, 0.9rem);
    letter-spacing:0.22em;
    text-transform:uppercase;
    font-weight:600;
  }
  .watermark-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(2.2rem, 9vw, 3.6rem);
    line-height:1;
    margin-top:2px;
  }
  #app{ position:relative; z-index:1; display:flex; flex-direction:column; flex:1 1 auto; }
  .site-footer{
    position:relative;
    z-index:1;
    text-align:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.7rem;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    background:var(--paper);
    border-top:1px solid var(--paper-line);
    padding:10px 14px 14px;
  }

  /* Modal konfirmasi kustom (pengganti confirm() bawaan browser) */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(15,30,20,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    background:var(--paper-white);
    border-radius:6px;
    padding:22px 20px;
    max-width:380px;
    width:100%;
    box-shadow:var(--shadow);
  }
  .modal-card p{ margin:0 0 18px; font-size:0.95rem; color:var(--ink); line-height:1.4; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:4px;
    font-weight:600;
    font-size:0.88rem;
    cursor:pointer;
    border:none;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .modal-btn-yes{ background:var(--cover); color:#fff; }
  .modal-btn-yes:hover{ background:var(--cover-dark); }
  .modal-btn-cancel{ background:transparent; border:1px solid var(--paper-line)!important; color:var(--ink-soft); }
  .modal-btn-cancel:hover{ background:var(--paper); }
</style>
</head>
<body>
  <div class="book">
    <div class="watermark" aria-hidden="true">
      <span class="watermark-label">made by</span>
      <span class="watermark-name">DFF</span>
    </div>
    <div id="app"></div>
    <div class="site-footer">&copy; 2026 DFF Company. All rights reserved.</div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
      <p id="confirmModalMsg"></p>
      <div class="modal-actions">
        <button class="modal-btn-cancel" onclick="hideConfirm()">Batal</button>
        <button class="modal-btn-yes" onclick="confirmYes()">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

<script>
let rows = [];
let keperluan = [];
let screen = 'loading';
let draft = { hari:'', tanggal:'', bulan:'', keterangan:'', kategori:'', nominal:0 };
let draftKeperluan = { keterangan:'', nominal:0, bulan:'', tahun:'' };
let ready = false;
let editingRowId = null;
let editingKeperluanId = null;
let perincianSearchQuery = '';
let alokasiBulan = '';

const HARI_LIST = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const BULAN_LIST = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const KATEGORI_LIST = [
  { value:'jajan', label:'Jajan' },
  { value:'transportasi', label:'Transportasi' },
  { value:'keperluan', label:'Keperluan' },
  { value:'makanan_utama', label:'Makanan Utama' }
];
function kategoriLabel(val){
  const found = KATEGORI_LIST.find(k=>k.value===val);
  return found ? found.label : '&mdash;';
}
function genId(prefix){
  return prefix + Date.now() + Math.random().toString(16).slice(2,7);
}

function formatRupiah(n){
  const v = Number(n)||0;
  return 'Rp' + new Intl.NumberFormat('id-ID').format(v);
}
function digitsOnly(str){ return (str||'').replace(/[^0-9]/g,''); }
function formatCurrencyInput(el){
  const raw = digitsOnly(el.value);
  el.dataset.raw = raw;
  el.value = raw ? new Intl.NumberFormat('id-ID').format(Number(raw)) : '';
}
function getRawNumber(el){ return Number(el.dataset.raw || digitsOnly(el.value) || 0); }
function currentSaldo(){
  if(rows.length===0) return 0;
  return rows[rows.length-1].saldoSetelah;
}

const STORAGE_KEY = 'bukuKasRows';

async function loadRows(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    rows = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Gagal memuat data', e);
    rows = [];
  }
}
async function saveRows(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
  }catch(e){
    console.error('Gagal menyimpan data', e);
    alert('Gagal menyimpan data. Mungkin penyimpanan browser penuh atau diblokir.');
  }
}

const KEPERLUAN_KEY = 'bukuKasKeperluan';

async function loadKeperluan(){
  try{
    const raw = localStorage.getItem(KEPERLUAN_KEY);
    keperluan = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Gagal memuat data keperluan', e);
    keperluan = [];
  }
}
async function saveKeperluan(){
  try{
    localStorage.setItem(KEPERLUAN_KEY, JSON.stringify(keperluan));
  }catch(e){
    console.error('Gagal menyimpan data keperluan', e);
    alert('Gagal menyimpan data. Mungkin penyimpanan browser penuh atau diblokir.');
  }
}

/* Melengkapi data lama (sebelum fitur id/kategori/createdAt ada) supaya fitur edit,
   hapus, pencarian, dan alokasi dana tetap berjalan pada data yang sudah tersimpan. */
function migrateData(){
  let changed = false;
  rows.forEach((r,i)=>{
    if(!r.id){ r.id = genId('r'); changed = true; }
    if(!r.createdAt){ r.createdAt = i; changed = true; }
    if(r.tipe==='pengeluaran' && typeof r.kategori === 'undefined'){ r.kategori = ''; changed = true; }
  });
  keperluan.forEach((k,i)=>{
    if(!k.createdAt){ k.createdAt = i; changed = true; }
  });
  if(changed){ saveRows(); saveKeperluan(); }
}

/* Menghitung ulang saldo berjalan setiap baris sesuai urutan array (dipakai setelah edit/hapus) */
function recalcSaldoAll(){
  let saldo = 0;
  rows.forEach(r=>{
    if(r.tipe==='saldo') saldo += Number(r.nominal)||0;
    else saldo -= Number(r.nominal)||0;
    r.saldoSetelah = saldo;
  });
}

function editRow(id){

}

function submitEditRow(){
  const row = rows.find(r=>r.id===editingRowId);
  if(!row) return;
  const nominalVal = getRawNumber(document.getElementById('editRowNominalInput'));
  clearError('editRowError');
  if(!nominalVal || nominalVal<=0){

    const bulanVal = document.getElementById('editRowBulanSelect').value;

/* Info tanggal hari ini sesuai kalender device, dipetakan ke format HARI_LIST/BULAN_LIST */
function getTodayInfo(){
  const now = new Date();
  const hariIdx = (now.getDay() + 6) % 7; /* JS: 0=Minggu -> geser jadi Senin=0 */
  return {
    hari: HARI_LIST[hariIdx],
    tanggal: now.getDate(),
    bulan: BULAN_LIST[now.getMonth()],
    tahun: now.getFullYear()
  };
}
function getTahunOptions(){
  const start = new Date().getFullYear();
  const arr = [];
  for(let i=0;i<5;i++) arr.push(start+i);
  return arr;
}
function dueKeperluanItems(){
  const t = getTodayInfo();
  return keperluan.filter(k => k.bulan === t.bulan && Number(k.tahun) === t.tahun);
}

/* ---------- Modal konfirmasi kustom (pengganti confirm() bawaan browser) ---------- */
let pendingConfirmAction = null;
function showConfirm(message, onYes){
  pendingConfirmAction = onYes;
  document.getElementById('confirmModalMsg').textContent = message;
  document.getElementById('confirmModal').classList.add('show');
}
function hideConfirm(){
  document.getElementById('confirmModal').classList.remove('show');
  pendingConfirmAction = null;
}
function confirmYes(){
  const action = pendingConfirmAction;
  hideConfirm();
  if(action) action();
}

function goTo(s){
  screen = s;
  render();
  window.scrollTo(0,0);
}

function showError(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
}
function clearError(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove('show');
  el.textContent = '';
}

/* ---------- Ekspor ke kalender device (.ics) ---------- */
function downloadICS(id){
  const item = keperluan.find(k=>k.id===id);
  if(!item) return;
  const monthIdx = BULAN_LIST.indexOf(item.bulan) + 1;
  const mm = String(monthIdx).padStart(2,'0');
  const dateStr = `${item.tahun}${mm}01`;
  const uid = item.id + '@buku-kas';
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Buku Kas//ID',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dateStr}`,
    `SUMMARY:Keperluan: ${item.keterangan}`,
    `DESCRIPTION:Rencana pembelian sebesar ${formatRupiah(item.nominal)}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `keperluan-${item.keterangan.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Notifikasi bulanan ---------- */
function requestNotifPermission(){
  if(typeof Notification === 'undefined'){
    alert('Browser ini tidak mendukung notifikasi.');
    return;
  }
  Notification.requestPermission().then(()=>{
    checkMonthlyNotification();
    render();
  });
}

function checkMonthlyNotification(){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const due = dueKeperluanItems();
  if(due.length===0) return;
  const t = getTodayInfo();
  const flagKey = 'bukuKasNotifShown-' + t.bulan + t.tahun;
  if(localStorage.getItem(flagKey)) return;
  try{
    new Notification('Keperluan bulan ini!', {
      body: `${due.length} rencana pembelian jatuh tempo bulan ${t.bulan} ${t.tahun}.`
    });
  }catch(e){
    console.error('Gagal menampilkan notifikasi', e);
  }
  localStorage.setItem(flagKey, '1');
}

/* ---------- Perincian Dana: gabungan data + pencarian ---------- */
function getCombinedPerincian(){
  const list = [];
  rows.forEach(r=>{
    list.push({
      source:'row',
      id:r.id,
      sortKey:r.createdAt||0,
      cls: r.tipe==='saldo' ? 'row-saldo' : 'row-pengeluaran',
      tanggalLabel: r.tipe==='saldo' ? '&mdash;' : `${r.hari}, ${r.tanggal} ${r.bulan}`,
      keterangan: r.keterangan,
      kategoriLabel: r.tipe==='saldo' ? '&mdash;' : `<span class="kategori-badge ${r.kategori}">${kategoriLabel(r.kategori)}</span>`,
      nominalLabel: r.tipe==='saldo' ? ('+ ' + formatRupiah(r.nominal)) : ('&minus; ' + formatRupiah(r.nominal)),
      saldoLabel: formatRupiah(r.saldoSetelah),
      searchText: (r.keterangan + ' ' + kategoriLabel(r.kategori) + ' ' + r.bulan).toLowerCase(),
      actions: `<div class="row-aksi">
          <button class="edit-btn" onclick="editRow('${r.id}')">Edit</button>
          <button class="del-btn" onclick="deleteRow('${r.id}')">Hapus</button>
        </div>`
    });
  });
  keperluan.forEach(k=>{
    list.push({
      source:'keperluan',
      id:k.id,
      sortKey:k.createdAt||0,
      cls:'row-keperluan',
      tanggalLabel:`Rencana: ${k.bulan} ${k.tahun}`,
      keterangan:k.keterangan,
      kategoriLabel:`<span class="kategori-badge keperluan">Keperluan</span>`,
      nominalLabel: '~ ' + formatRupiah(k.nominal),
      saldoLabel: '&mdash;',
      searchText: (k.keterangan + ' keperluan ' + k.bulan).toLowerCase(),
      actions: `<div class="row-aksi">
          <button class="edit-btn" onclick="editKeperluan('${k.id}')">Edit</button>
          <button class="del-btn" onclick="hapusKeperluan('${k.id}')">Hapus</button>
        </div>`
    });
  });
  list.sort((a,b)=>a.sortKey-b.sortKey);
  return list;
}

function renderPerincianTable(){
  const container = document.getElementById('perincianTableContainer');
  if(!container) return;
  const all = getCombinedPerincian();
  const q = perincianSearchQuery.trim().toLowerCase();
  const filtered = q ? all.filter(item=>item.searchText.includes(q)) : all;
  let html;
  if(all.length===0){
    html = `<div class="empty-state">Belum ada transaksi. Mulai dengan Isi Saldo atau Pengeluaran.</div>`;
  }else if(filtered.length===0){
    html = `<div class="search-empty">Tidak ada transaksi yang cocok dengan pencarian "${perincianSearchQuery}".</div>`;
  }else{
    const trs = filtered.map((item,i)=>`
      <tr class="${item.cls}">
        <td>${i+1}</td>
        <td>${item.tanggalLabel}</td>
        <td class="ket">${item.keterangan}</td>
        <td>${item.kategoriLabel}</td>
        <td class="num nominal">${item.nominalLabel}</td>
        <td class="num saldo-col">${item.saldoLabel}</td>
        <td class="aksi-col">${item.actions}</td>
      </tr>
    `).join('');
    html = `
      <div class="ledger-table-wrap">
        <table class="ledger">
          <thead><tr>
            <th>No.</th><th>Hari/Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Nominal</th><th>Saldo</th><th>Aksi</th>
          </tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
    `;
  }
  container.innerHTML = html;
}

function onPerincianSearch(val){
  perincianSearchQuery = val;
  renderPerincianTable();
}

/* ---------- Alokasi Dana: agregasi per kategori & per bulan ---------- */
/* Semua kategori (termasuk "Keperluan") dihitung dari pengeluaran yang sudah
   direalisasikan (rows bertipe 'pengeluaran'). Baris kategori "Keperluan" bisa
   berasal dari pencatatan manual, atau otomatis saat menekan tombol "Beli" pada
   List Keperluan (saldo berkurang, item hilang dari List Keperluan, dan nominalnya
   masuk ke kategori "Keperluan" di Alokasi Dana bulan tersebut). */
function computeAlokasiTotals(bulan){
  const totals = { jajan:0, transportasi:0, keperluan:0, makanan_utama:0 };
  rows.forEach(r=>{
    if(r.tipe==='pengeluaran' && r.bulan===bulan && totals.hasOwnProperty(r.kategori)){
      totals[r.kategori] += Number(r.nominal)||0;
    }
  });
  return totals;
}

function screenAlokasiDana(){
  if(!alokasiBulan){
    alokasiBulan = getTodayInfo().bulan;
  }
  const totals = computeAlokasiTotals(alokasiBulan);
  const grandTotal = totals.jajan + totals.transportasi + totals.keperluan + totals.makanan_utama;
  const bulanOpts = BULAN_LIST.map(b=>`<option value="${b}" ${alokasiBulan===b?'selected':''}>${b}</option>`).join('');

  const catMeta = [
    { key:'jajan', label:'Jajan', color:'var(--cat-jajan)' },
    { key:'transportasi', label:'Transportasi', color:'var(--cat-transportasi)' },
    { key:'keperluan', label:'Keperluan', color:'var(--cat-keperluan)' },
    { key:'makanan_utama', label:'Makanan Utama', color:'var(--cat-makanan)' }
  ];

  let pieStyle, pieCenter, legendHtml;
  if(grandTotal<=0){
    pieStyle = 'background:var(--paper-line);';
    pieCenter = `<span></span><strong>Belum ada data</strong>`;
    legendHtml = `<div class="empty-state">Belum ada pengeluaran atau rencana keperluan pada bulan ${alokasiBulan}.</div>`;
  }else{
    let cursor = 0;
    const stops = [];
    catMeta.forEach(c=>{
      const val = totals[c.key];
      if(val<=0) return;
      const pct = (val/grandTotal)*100;
      const start = cursor;
      const end = cursor + pct;
      stops.push(`${c.color} ${start}% ${end}%`);
      cursor = end;
    });
    pieStyle = `background: conic-gradient(${stops.join(', ')});`;
    pieCenter = `<small>Total</small><strong>${formatRupiah(grandTotal)}</strong>`;
    legendHtml = `
      <div class="alokasi-legend">
        ${catMeta.map(c=>{
          const val = totals[c.key];
          const pct = grandTotal>0 ? ((val/grandTotal)*100).toFixed(1) : '0.0';
          return `
            <div class="alokasi-item">
              <div class="alokasi-item-label">
                <span class="alokasi-dot" style="background:${c.color};"></span>
                <span class="alokasi-item-name">${c.label}</span>
              </div>
              <div class="alokasi-item-values">
                <div class="alokasi-item-nominal">${formatRupiah(val)}</div>
                <div class="alokasi-item-pct">${pct}%</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  return `
    <div class="topbar"><span class="topbar-brand">Buku Kas</span><span class="topbar-saldo">${formatRupiah(currentSaldo())}</span></div>
    <div class="page-content">
      <div class="screen-header"><button class="back-link" onclick="goTo('main')">&lsaquo; Kembali</button></div>
      <h2 class="screen-title">Alokasi Dana</h2>
      <p class="screen-desc">Gabungan pengeluaran per kategori, dipisahkan per bulan.</p>
      <div class="field bulan-select-wrap">
        <label>Pilih Bulan</label>
        <select id="alokasiBulanSelect" onchange="alokasiBulan=this.value; goTo('alokasiDana')">${bulanOpts}</select>
      </div>
      <div class="pie-wrap">
        <div class="pie-chart" style="${pieStyle}">
          <div class="pie-total">${pieCenter}</div>
        </div>
      </div>
      ${legendHtml}
      <p class="alokasi-note">Kategori "Keperluan" bertambah saat Anda menekan tombol "Beli" pada List Keperluan (saldo berkurang dan item hilang dari List Keperluan), atau saat Anda mencatat pengeluaran manual dengan kategori "Keperluan". Bulan yang dipakai mengikuti bulan rencana pembelian keperluan tersebut.</p>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = screenLoading(); return; }
  switch(screen){
    case 'main': app.innerHTML = screenMain(); break;
    case 'isiSaldo': app.innerHTML = screenIsiSaldo(); break;
    case 'pengeluaranTanggal': app.innerHTML = screenPengeluaranTanggal(); break;
    case 'pengeluaranKeterangan': app.innerHTML = screenPengeluaranKeterangan(); break;
    case 'pengeluaranNominal': app.innerHTML = screenPengeluaranNominal(); break;
    case 'pengeluaranSelesai': app.innerHTML = screenPengeluaranSelesai(); break;
    case 'keperluanKeterangan': app.innerHTML = screenKeperluanKeterangan(); break;
    case 'keperluanNominal': app.innerHTML = screenKeperluanNominal(); break;
    case 'keperluanBulan': app.innerHTML = screenKeperluanBulan(); break;
    case 'keperluanSelesai': app.innerHTML = screenKeperluanSelesai(); break;
    case 'listKeperluan': app.innerHTML = screenListKeperluan(); break;
    case 'editKeperluan': app.innerHTML = screenEditKeperluan(); break;
    case 'perincian': app.innerHTML = screenPerincian(); break;
    case 'editRow': app.innerHTML = screenEditRow(); break;
    case 'alokasiDana': app.innerHTML = screenAlokasiDana(); break;
    default: app.innerHTML = screenMain();
  }
  if(screen==='perincian') renderPerincianTable();
}

(async function init(){
  render();
  await loadRows();
  await loadKeperluan();
  migrateData();
  ready = true;
  screen = 'main';
  render();
  checkMonthlyNotification();
})();
</script>
